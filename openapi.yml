        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Content]
      summary: Delete a "now" item
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ────────────────────────── CMS · Layout & Gallery ──────────────────────────
  /api/cms/layout:
    put:
      tags: [CMS · Layout & Gallery]
      summary: Save module placement
      description: |
        The whole per-area module order in one request, atomic so a half-applied order can't be
        left behind. Unknown areas or modules, a module placed in two areas, or a result that
        fails the nav lint (for example an empty area) are 400. Optional per-area `description`
        and `label` are written only when sent; an all-empty `description` clears it and an
        all-empty `label` is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              additionalProperties: false
              properties:
                order:
                  type: array
                  items:
                    type: object
                    required: [area, modules]
                    additionalProperties: false
                    properties:
                      area: { type: string, minLength: 1 }
                      modules: { type: array, items: { type: string } }
                      description: { $ref: "#/components/schemas/Localized" }
                      label: { $ref: "#/components/schemas/Localized" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/preview:
    post:
      tags: [CMS · Layout & Gallery]
      summary: Resolve a pending layout (writes nothing)
      description: Returns the `SiteView` the site *would* render with the given pending order. Used by the editor canvas; persists nothing. An unknown `locale` falls back to `en`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              additionalProperties: false
              properties:
                order:
                  type: array
                  items:
                    type: object
                    required: [area, modules]
                    additionalProperties: false
                    properties:
                      area: { type: string, minLength: 1 }
                      modules: { type: array, items: { type: string } }
                locale: { type: string, enum: [en, de] }
      responses:
        "200":
          description: The resolved preview view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/gallery/{id}:
    put:
      tags: [CMS · Layout & Gallery]
      summary: Upsert a gallery image placement
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Layout & Gallery]
      summary: Remove a gallery image placement
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/gallery-order:
    put:
      tags: [CMS · Layout & Gallery]
      summary: Reorder a whole gallery
      description: Sends the full ordered id list for one gallery module; the server renumbers `sort` to 0..n-1.
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/gallery-module:
    post:
      tags: [CMS · Layout & Gallery]
      summary: Create a new gallery module
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200":
          description: Created; returns the new module id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/gallery-module/{id}:
    delete:
      tags: [CMS · Layout & Gallery]
      summary: Delete a gallery module (and its placements)
      description: Removes the gallery module and its image placements. Library assets are untouched.
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: Not a gallery module, or the built-in default gallery (which can't be deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ──────────────────────────────── CMS · Assets ──────────────────────────────
  /api/cms/assets:
    get:
      tags: [CMS · Assets]
      summary: List assets
      description: The asset library, optionally filtered by folder, tag, kind, or a text query.
      parameters:
        - { name: folder, in: query, required: false, description: "A folder id, or `root` for assets outside any folder.", schema: { type: string } }
        - { name: tag, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [image, svg, gif, pdf, markdown, file] } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The matching assets (contract `AssetListResponse` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `AssetListResponse` in `@lg/core`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [CMS · Assets]
      summary: Upload an asset
      description: |
        Multipart upload. Raster images are re-encoded, SVGs are run through a parser-based
        sanitizer before storing, and size is capped — active content never lands unsanitized.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The created asset (contract `Asset` in `@lg/core`), or the existing one when identical bytes were already stored.
          content:
            application/json:
              schema: { type: object, description: "See `Asset` in `@lg/core`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The file exceeds the size cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported file type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/cms/assets/{id}:
    get:
      tags: [CMS · Assets]
      summary: Asset detail
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      responses:
        "200":
          description: The asset detail (contract `AssetDetail` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `AssetDetail` in `@lg/core`." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [CMS · Assets]
      summary: Edit asset metadata (filename, alt, title, caption, description, slug, tags, folder)
      description: |
        Only the fields sent are changed. Text fields that are not strings are ignored. `slug` is
        for markdown assets only (400 otherwise, and 400 when empty); a slug already owned by
        another asset is 409. `tags` replaces the whole tag set. `folderId` may be `null` to move
        the asset out of any folder.
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
                alt: { type: string }
                title: { type: string }
                caption: { type: string }
                description: { type: string }
                slug: { type: string }
                folderId: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated asset (contract `Asset` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `Asset` in `@lg/core`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The requested slug is already taken by another asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [CMS · Assets]
      summary: Delete an asset
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cms/assets/{id}/content:
    get:
      tags: [CMS · Assets]
      summary: Read a markdown asset's source for editing
      description: |
        The authenticated counterpart of `/api/assets/md/{slug}`, addressed by id so the editor
        can open drafts. Returns the asset plus its `markdown` source, and a `previewToken` when
        the asset has a slug and a preview secret is configured.
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      responses:
        "200":
          description: The asset with its markdown source.
          content:
            application/json:
              schema:
                type: object
                description: An `Asset` plus `markdown` and, when available, `previewToken`.
                required: [markdown]
                properties:
                  markdown: { type: string }
                  previewToken: { type: string }
        "400":
          description: The asset is not a markdown asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [CMS · Assets]
      summary: Rewrite a markdown asset's source
      description: Replaces a markdown asset's bytes, keeping its id stable.
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown: { type: string }
      responses:
        "200":
          description: The updated asset plus its `markdown` source.
          content:
            application/json:
              schema:
                type: object
                description: An `Asset` plus `markdown`.
                required: [markdown]
                properties:
                  markdown: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The markdown exceeds the size cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/cms/assets/folders:
    post:
      tags: [CMS · Assets]
      summary: Create an asset folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parentId: { type: [string, "null"] }
      responses:
        "200":
          description: The folder (contract `AssetFolderResponse` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `AssetFolderResponse` in `@lg/core`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/assets/folders/{id}:
    patch:
      tags: [CMS · Assets]
      summary: Rename or move an asset folder
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: [string, "null"] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Assets]
      summary: Delete an asset folder
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────────── CMS · Guestbook ────────────────────────────
  /api/cms/guestbook:
    get:
      tags: [CMS · Guestbook]
      summary: The moderation queue
      description: >
        Guestbook entries with their auto-flag score (which only sorts the queue). Without `status`
        (or with `all`) the combined queue is returned, pending first. `counts` is always the full
        per-status tally regardless of the filter.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected, all] }
      responses:
        "200":
          description: Entries plus counts.
          content:
            application/json:
              schema:
                type: object
                required: [entries, pending, counts]
                properties:
                  entries: { type: array, items: { type: object, description: "`GuestbookEntry` in `@lg/core`." } }
                  pending: { type: integer, description: Same as `counts.pending`. }
                  counts:
                    type: object
                    required: [pending, approved, rejected]
                    properties:
                      pending: { type: integer }
                      approved: { type: integer }
                      rejected: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/guestbook/{id}/{action}:
    post:
      tags: [CMS · Guestbook]
      summary: Moderate an entry
      description: Approve (make public), reject, or unapprove (return to pending) an entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [approve, reject, unapprove] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cms/guestbook/{id}:
    delete:
      tags: [CMS · Guestbook]
      summary: Delete an entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────────── CMS · Analytics ────────────────────────────
  /api/cms/analytics:
    get:
      tags: [CMS · Analytics]
      summary: Aggregate analytics
      description: |
        Engagement (in-page script) and traffic (proxy access log) aggregates over a window.

        `visits` is script-confirmed and `pageviews` comes from the access log, so they differ
        by every client that never runs JavaScript; each carries its `source`. `paths` is grouped
        by first path segment, with `children` listing the stored sub-paths of a group.

        A `dim`/`key` filter narrows the other access-log lists (`paths`, `referrers`, `browsers`,
        `os`, `devices`, `bots`, `probes`) through pair counters written at ingest. The script's
        `engagement` lists cannot be cross-filtered and are named in `filtered.notFilterable`.
      parameters:
        - name: hours
          in: query
          required: false
          description: Rolling window size in hours (default 720). Clamped to 1..9600 rather than rejected; a non-numeric value falls back to the default. Ignored when `from` and `to` are given.
          schema: { type: integer }
        - name: from
          in: query
          required: false
          description: Custom range start, a local calendar day. Requires `to`; the span may not exceed 400 days.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Custom range end (inclusive), a local calendar day. Requires `from`.
          schema: { type: string, format: date }
        - name: tz
          in: query
          required: false
          description: IANA time zone day buckets are expressed in. Defaults to the owner's zone.
          schema: { type: string, example: Europe/Berlin }
        - name: at
          in: query
          required: false
          description: Narrow the lists (not the chart) to one bucket, `YYYY-MM-DD` or `YYYY-MM-DDTHH`.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}(T\d{2})?$' }
        - name: dim
          in: query
          required: false
          description: Dimension to filter by. Requires `key`.
          schema:
            type: string
            enum: [path, referrer, browser, os, device, bot, probe, tab, exit, transition, dwell, scroll, session_tabs, session_dwell, click, project, viewport, theme]
        - name: key
          in: query
          required: false
          description: Display key to filter to (a referrer's grouped label, a path group such as `/docs` or one stored path, or the raw key). Requires `dim`.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The analytics response (contract `AnalyticsResponse` in `@lg/core`).
          content:
            application/json:
              schema:
                type: object
                description: "See `AnalyticsResponse` in `@lg/core`."
                properties:
                  visits: { $ref: "#/components/schemas/TrafficFigure" }
                  pageviews: { $ref: "#/components/schemas/TrafficFigure" }
                  metricSources:
                    type: object
                    description: Where each metric tile's number comes from.
                    additionalProperties: { type: string, enum: [script, log] }
                  paths:
                    type: array
                    items:
                      type: object
                      required: [key, count]
                      properties:
                        key: { type: string }
                        count: { type: integer }
                        children:
                          type: array
                          description: Stored sub-paths summed into this group; absent for a single path.
                          items:
                            type: object
                            required: [key, count]
                            properties:
                              key: { type: string }
                              count: { type: integer }
                  filtered:
                    type: object
                    description: Present when `dim`/`key` is active.
                    properties:
                      dimension: { type: string }
                      key: { type: string }
                      series:
                        type: array
                        description: The filtered dimension's own counts over time, covering the full range.
                        items:
                          type: object
                          required: [bucket, key, count]
                          properties:
                            bucket: { type: string, description: "Time bucket, an hour (`YYYY-MM-DDTHH`) or a local day (`YYYY-MM-DD`) depending on `range.unit`." }
                            key: { type: string }
                            count: { type: integer }
                      total: { type: integer }
                      previous: { type: [integer, "null"] }
                      narrowed:
                        type: array
                        description: Top-level lists narrowed by the filter.
                        items: { type: string }
                      notFilterable:
                        type: array
                        description: Lists left whole because their source cannot be crossed with the filter.
                        items:
                          type: object
                          properties:
                            card: { type: string }
                            source: { type: string, enum: [script, log] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/analytics/clear:
    post:
      tags: [CMS · Analytics]
      summary: Clear analytics
      description: |
        Deletes aggregate analytics for a named range. Windowed ranges delete hour-bucketed
        engagement counters; `all` also wipes the log-derived day stats. The deletion is made
        durable by advancing a watermark so a rotated access log is not re-ingested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [range]
              properties:
                range:
                  type: string
                  enum: [hour, 24h, 3d, 7d, all]
      responses:
        "200":
          description: Cleared (contract `ClearAnalyticsResponse` in `@lg/core`).
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok: { const: true }
                  removed: { type: integer, minimum: 0, description: Number of aggregate rows deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ──────────────────────────────── CMS · Status ──────────────────────────────
  /api/cms/status:
    put:
      tags: [CMS · Content]
      summary: Update the "currently building" status (verb + now)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroStatusBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [CMS · Status]
      summary: Dashboard status
      description: >
        Per-job sync status (sources, presence sampler, metadata sweeps, analytics ingest), guestbook
        counts by status, and the ten most recent content edits.
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [sources, guestbook, recentEdits]
                properties:
                  sources:
                    type: array
                    description: >
                      Always lists github, wakapi, presence, game-metadata, game-images and analytics,
                      including never-synced and unconfigured ones.
                    items:
                      type: object
                      required: [id, label, kind, configured, mock, schedule, canSync, state, lastSuccessAt, lastErrorAt, lastError]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        kind: { type: string, enum: [source, job, analytics] }
                        configured: { type: boolean }
                        mock: { type: boolean, description: Running on the deterministic mock source. }
                        schedule: { type: [string, "null"], description: "Cron expression, sources only." }
                        canSync: { type: boolean, description: "True when POST /api/cms/sync/{source} accepts this id." }
                        state: { type: string, enum: [ok, error, never], description: "`error` when the latest attempt failed." }
                        lastSuccessAt: { type: [string, "null"], format: date-time }
                        lastErrorAt: { type: [string, "null"], format: date-time }
                        lastError: { type: [string, "null"] }
                  guestbook:
                    type: object
                    required: [pending, approved, rejected]
                    properties:
                      pending: { type: integer }
                      approved: { type: integer }
                      rejected: { type: integer }
                  recentEdits:
                    type: array
                    items:
                      type: object
                      required: [id, savedAt, reason, label, kind, restorable]
                      properties:
                        id: { type: integer, description: "Revision id within the id space named by `kind`. Only `content` ids are valid for /api/cms/revisions." }
                        kind: { type: string, enum: [content, ia], description: "`ia` rows are layout and section-heading edits, archived separately." }
                        restorable: { type: boolean, description: "True only for `content` rows." }
                        savedAt: { type: string, format: date-time }
                        reason: { type: string, description: "Raw table/column name, `restore:<id>`, or `ia:<nav|modules|module-added|module-removed>` for layout edits." }
                        label: { type: string, description: Human-readable label for `reason`. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/sync/{source}:
    post:
      tags: [CMS · Status]
      summary: Sync one source now
      description: >
        Runs a registered source immediately and records the outcome. A trigger that arrives while the
        same source is already syncing joins that run and returns its result.
      parameters:
        - { name: source, in: path, required: true, schema: { type: string, enum: [github, wakapi] } }
      responses:
        "200":
          description: The sync result. A failed sync is still 200 with `ok:false` and `error`.
          content:
            application/json:
              schema:
                type: object
                required: [sourceId, ok, mock, syncedAt]
                properties:
                  sourceId: { type: string }
                  ok: { type: boolean }
                  mock: { type: boolean }
                  syncedAt: { type: string, format: date-time }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The sync worker is not running. }

  /api/cms/sections:
    get:
      tags: [CMS · Status]
      summary: Section stats for the editor overlay
      description: >
        Per-nav-node stats from the in-page tracker only (`source: script`). Tracking granularity is
        the nav node, so modules inside one area share that area's numbers (`modules` lists them).
        Median dwell is approximated from the dwell buckets as the midpoint of the bucket holding the
        50th percentile (<5s 2.5s, 5-15s 10s, 15-30s 22.5s, 30-60s 45s, 1-3m 120s, 3-10m 390s,
        10m+ 900s). Reach is the share of completed visits whose scroll reached 25% of the section,
        capped at 1; null when there are no completed visits in the window.
      parameters:
        - { name: area, in: query, required: false, schema: { type: string }, description: Nav node id; returns it and its descendants. Omit for every node. }
        - { name: hours, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 8760, default: 168 } }
      responses:
        "200":
          description: Section stats.
          content:
            application/json:
              schema:
                type: object
                required: [source, hours, from, to, visits, sections]
                properties:
                  source: { type: string, enum: [script] }
                  hours: { type: integer }
                  from: { type: string, description: Inclusive UTC hour bucket (YYYY-MM-DDTHH). }
                  to: { type: string }
                  visits: { type: integer, description: Completed visits in the window. }
                  sections:
                    type: array
                    items:
                      type: object
                      required: [key, modules, views, medianDwellSeconds, medianDwellBucket, reach, depth]
                      properties:
                        key: { type: string, description: Nav node id. }
                        modules: { type: array, items: { type: string } }
                        views: { type: integer }
                        medianDwellSeconds: { type: [number, "null"] }
                        medianDwellBucket: { type: [string, "null"] }
                        reach: { type: [number, "null"], minimum: 0, maximum: 1 }
                        depth:
                          type: object
                          description: Raw scroll milestone counts.
                          properties:
                            "25": { type: integer }
                            "50": { type: integer }
                            "75": { type: integer }
                            "100": { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/activity-names:
    get:
      tags: [CMS · Status]
      summary: Recorded activity names
      description: Distinct names from observed presence sessions, most-seen first, for the hidden-activities tag input.
      responses:
        "200":
          description: Names.
          content:
            application/json:
              schema:
                type: object
                required: [names]
                properties:
                  names:
                    type: array
                    items:
                      type: object
                      required: [name, category, sessions]
                      properties:
                        name: { type: string }
                        category: { $ref: "#/components/schemas/PresenceCategory" }
                        sessions: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────────── CMS · Revisions ────────────────────────────
  /api/cms/revisions:
    get:
      tags: [CMS · Revisions]
      summary: Content history (newest first)
      responses:
        "200":
          description: The revision summaries (contract `RevisionListResponse` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `RevisionListResponse` in `@lg/core`." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/revisions/{id}:
    get:
      tags: [CMS · Revisions]
      summary: A single revision
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The revision (contract `RevisionResponse` in `@lg/core`).
          content:
            application/json:
              schema: { type: object, description: "See `RevisionResponse` in `@lg/core`." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cms/revisions/{id}/restore:
    post:
      tags: [CMS · Revisions]
      summary: Restore a revision (writes forward)
      description: Puts a past revision back. The restore is itself archived, so history stays append-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Restored; reports whether the module lists differ (contract `RestoreResponse`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  listsDiffer: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

# ═══════════════════════════════ Components ═══════════════════════════════════
components:
  securitySchemes:
    cmsSession:
      type: apiKey
      in: cookie
      name: lg_session
      description: |
        Signed, http-only session cookie issued by the GitHub OAuth flow. This is the primary
        credential the CMS UI uses; requests are sent with credentials (cross-origin CORS is
        locked to the configured web origin).
    cmsBearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <CMS_TOKEN>` — a fallback for scripts and first-time setup. Prefer
        the OAuth session for interactive use.

  parameters:
    Locale:
      name: locale
      in: query
      required: false
      description: Content locale. Defaults to `en`.
      schema:
        type: string
        enum: [en, de]
        default: en
    Day:
      name: day
      in: query
      required: true
      description: A calendar day, `YYYY-MM-DD`.
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
    AssetId:
      name: id
      in: path
      required: true
      description: Asset id.
      schema:
        type: string
    EntityId:
      name: id
      in: path
      required: true
      description: Entity id (the caller assigns stable ids).
      schema:
        type: string

  requestBodies:
    JsonBody:
      description: |
        A JSON body validated at the boundary against the route's schema. Shared field limits
        (name/message/etc.) live once in `@lg/core` (`FIELD_LIMITS`) and are enforced on both the
        client and here. See `@lg/core` for the exact shape of each content type.
      required: true
      content:
        application/json:
          schema:
            type: object

  responses:
    Ok:
      description: Success.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    BadRequest:
      description: The body, params, or query failed boundary validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadDay:
      description: '`day` was not a `YYYY-MM-DD` date.'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid CMS credential (session cookie or bearer token).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests from this client in the current window.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TrafficFigure:
      type: object
      description: A traffic total with where it was measured.
      required: [total, previous, source]
      properties:
        total: { type: integer }
        previous: { type: [integer, "null"], description: "Same figure over the preceding window; null when there is none." }
        source: { type: string, enum: [script, log] }
    Ok:
      type: object
      description: A bare success acknowledgement.
      required: [ok]
      properties:
        ok:
          const: true
      additionalProperties: false

    Localized:
      type: object
      description: A human-authored string per locale. English is required; only `en` and `de` keys are accepted.
      required: [en]
      additionalProperties: false
      properties:
        en: { type: string }
        de: { type: string }

    PresenceCategory:
      type: string
      enum: [game, streaming, music, podcast, watching, custom]

    SiteMetaBody:
      type: object
      required: [name, handle, location, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        handle: { type: string, minLength: 1 }
        location: { $ref: "#/components/schemas/Localized" }
        role: { $ref: "#/components/schemas/Localized" }
        avatar:
          type: string
          description: An `asset:<id>` reference, or an empty string for no avatar.
          pattern: '^(asset:[A-Za-z0-9_-]+)?$'

    HeadlineBody:
      type: object
      required: [before, highlight, after]
      additionalProperties: false
      properties:
        before: { $ref: "#/components/schemas/Localized" }
        highlight: { $ref: "#/components/schemas/Localized" }
        after: { $ref: "#/components/schemas/Localized" }

    HeroStatusBody:
      type: object
      required: [verb, now]
      additionalProperties: false
      properties:
        verb: { $ref: "#/components/schemas/Localized" }
        now: { $ref: "#/components/schemas/Localized" }

    ListDisplaySettings:
      type: object
      additionalProperties: false
      properties:
        initialCount: { type: integer, minimum: 1, maximum: 50 }
        maxCount: { type: integer, minimum: 1, maximum: 50 }
        defaultRange:
          type: integer
          description: The window (in days) the module opens in.
          enum: [14, 30, 90, 180, 365]

    OkId:
      type: object
      description: A success that created something the caller must address by id.
      required: [ok, id]
      properties:
        ok:
          const: true
        id:
          type: string
      additionalProperties: false

    Error:
      type: object
      description: |
        The uniform error body. Every failure is mapped to this shape by one server-side error
        handler; internals and stack traces are never leaked.
      required: [error]
      properties:
        error:
          type: string
          description: A human-readable message safe to show a client.
      additionalProperties: false

    Health:
      type: object
      required: [status, lastSync, time]
      properties:
        status:
          const: ok
        lastSync:
          type: [string, "null"]
          format: date-time
          description: When the sync worker last succeeded, or `null` if it never has.
        time:
          type: string
          format: date-time

    PresenceView:
      type: object
      description: |
        The filtered presence the client is allowed to see. Deliberately minimal — no Discord id,
        no category list. `status: offline` with empty `cards` is a valid, common state.
      required: [status, cards]
      properties:
        status:
          type: string
          enum: [online, idle, dnd, offline]
        avatar:
          type: string
          format: uri
          description: Discord avatar URL, when the account exposes one.
        cards:
          type: array
          items:
            $ref: "#/components/schemas/PresenceCard"

    PresenceCard:
      type: object
      description: One curated, render-ready presence activity.
      required: [category, title]
      properties:
        category:
          type: string
          enum: [game, streaming, music, podcast, watching, custom]
        title:
          type: string
        subtitle:
          type: string
        image:
          type: string
          format: uri
          description: Art URL — the client routes this through `/api/presence/media`, never fetching it directly.
        since:
          type: integer
          description: Activity start time, epoch milliseconds, when known.

    PlaytimeDayResponse:
      type: object
      required: [day, games]
      properties:
        day:
          type: string
          format: date
        games:
          type: array
          items:
            type: object
            required: [name, minutes, sessions, exact]
            properties:
              name:
                type: string
              minutes:
                type: integer
              sessions:
                type: integer
                description: How many observed sessions made up the day.
              exact:
                type: boolean
                description: True when the minutes are a Steam total; false when observed (a floor).

    MusicDayResponse:
      type: object
      required: [day, tracks]
      properties:
        day:
          type: string
          format: date
        tracks:
          type: array
          items:
            type: object
            required: [song, artist, minutes, plays]
            properties:
              song:
                type: string
              artist:
                type: string
              minutes:
                type: integer
              plays:
                type: integer
              artUrl:
                type: string
                format: uri

    GuestbookSubmission:
      type: object
      description: A public guestbook submission. Limits come from `FIELD_LIMITS` in `@lg/core`.
      required: [name, message]
      properties:
        name:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        website:
          type: string
          description: Honeypot — real submissions leave this empty.

    ContactMessage:
      type: object
      description: A contact message. Relayed to email; nothing is stored. Limits from `FIELD_LIMITS`.
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        message:
          type: string
          minLength: 1
        website:
          type: string
          description: Honeypot — real submissions leave this empty.

    PulseBatch:
      type: object
      description: A batch of already-bucketed engagement events (validated against the live nav + vocabulary).
      required: [events]
      properties:
        events:
          type: array
          maxItems: 40
          items:
            type: object
            description: One engagement event.
            required: [d, k]
            properties:
              d:
                type: string
                description: Dimension (section, scroll depth, named click, movement, …).
              k:
                type: string
                description: Key within the dimension (e.g. a section id).

    SiteView:
      type: object
      description: |
        The fully resolved, localized site view: `meta`, `nav`, a `modules` map keyed by id, and
        `syncedAt`. It's large and its exact shape is defined once in TypeScript as `SiteView` in
        `@lg/core` (the single source of truth) — treated as an opaque render-ready object here
        rather than duplicated field-for-field.
      additionalProperties: true
      properties:
        locale:
          type: string
          enum: [en, de]
        meta:
          type: object
          description: Owner identity (name, handle, location, role).
        nav:
          type: array
          description: The visible navigation tree (drafts stripped).
          items:
            type: object
        modules:
          type: object
          description: Resolved modules keyed by id (hero, presence, playtime, music, activity, …).
        syncedAt:
          type: [string, "null"]
          format: date-time
