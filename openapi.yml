openapi: 3.1.0

info:
  title: letsgaming.de backend API
  version: 1.1.0
  license:
    name: MIT
  summary: The Fastify API behind letsgaming.de — a public read/relay surface and an authenticated CMS.
  description: |
    The backend for [letsgaming.de](https://letsgaming.de): a small Fastify service that
    accumulates data from GitHub/Steam/Wakapi/Lanyard into a local SQLite store and exposes
    it to the site.

    ## The one architectural rule: the server is the boundary
    The browser never talks to a third party directly. Discord, Steam and Spotify images,
    Lanyard presence, and every other upstream are fetched **server-side** and returned
    already filtered, so a visitor only ever contacts this origin. This is why endpoints like
    `/api/presence` and `/api/presence/media` exist at all — they are relays, not passthroughs.

    ## Two surfaces, two threat models
    - **Public** (`/api/*`, `/assets/*`, `/health`) — unauthenticated reads and a
      few write **relays** (contact, guestbook, engagement). Writes here persist only counters
      or nothing at all, are rate-limited per-IP in memory, and never set a cookie.
    - **CMS** (`/api/cms/*`) — authenticated content editing. A different threat model, kept on
      its own path; session/auth concerns never leak into the public surface.

    The site's own pages do **not** call `/api/site` at runtime — SSR reads the SQLite store
    directly. `/api/site` is the same resolved view over HTTP, kept for tooling and as the web
    app's fallback when it can't open the store file.

    ## Privacy by construction
    Analytics ingest (`POST /api/pulse`) writes only bucketed aggregate counters — no cookie,
    no identifier, no raw event rows, no client timestamps. The contact relay persists nothing.
    Client IPs are used only for transient in-memory rate limiting and are never stored.

  contact:
    name: LetsGaming
    url: https://letsgaming.de

servers:
  - url: https://letsgaming.de
    description: Production. The API shares the site origin behind the reverse proxy.
  - url: http://localhost:8787
    description: Local Fastify server (`pnpm dev:server`). The site dev server runs separately on :4321.

# Every operation requires a CMS credential unless it declares `security: []`.
security:
  - cmsSession: []
  - cmsBearer: []

tags:
  - name: Site
    description: The resolved site view (SSR reads the store directly; this is the HTTP mirror).
  - name: Presence
    description: Live Discord presence, relayed and filtered server-side from Lanyard.
  - name: Activity
    description: Accumulated history — playtime and music day drill-ins. Separate concern from presence.
  - name: Media
    description: Image relays and library assets, served from this origin so no visitor IP leaks upstream.
  - name: Guestbook
    description: Public, pre-moderated guestbook submissions.
  - name: Reactions
    description: Anonymous one-click reactions (the hero wave). A global counter, nothing per visitor.
  - name: Contact
    description: Contact relay to email. Stores nothing.
  - name: Engagement
    description: Cookieless, aggregate-only engagement beacons.
  - name: Health
    description: Liveness and last-sync probe.
  - name: Auth
    description: GitHub OAuth session for the CMS.
  - name: CMS · Content
    description: Authenticated. Edit the site's content (identity, prose, presence toggles, entities).
  - name: CMS · Layout & Gallery
    description: Authenticated. Module placement and gallery composition.
  - name: CMS · Assets
    description: Authenticated. The asset library (upload, edit, organize).
  - name: CMS · Guestbook
    description: Authenticated. Moderate the pending guestbook queue.
  - name: CMS · Analytics
    description: Authenticated. Read and clear aggregate analytics.
  - name: CMS · Revisions
    description: Authenticated. Content history and restore.
  - name: CMS · Status
    description: Authenticated. Dashboard status, manual sync, editor section stats, recorded activity names.

paths:
  # ─────────────────────────────── Public: read ───────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns `ok`, the last successful sync timestamp (or `null`), and server time.
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/site:
    get:
      tags: [Site]
      summary: The whole resolved site view
      description: |
        The entire site as normalized, localized, render-ready JSON — the same view the SSR
        pages build from the store. Nothing is fetched from an upstream on this path; it reflects
        whatever the last sync wrote. The site itself reads the store directly and only falls back
        to this endpoint when it can't open the store file.
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: The resolved site view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteView"

  /api/module/{id}:
    get:
      tags: [Site]
      summary: One resolved module, by id
      description: |
        A single resolved module (`{ id, kind, data }`) from the same view `/api/site`
        builds — the live-refresh endpoint the polling modules (playtime, music) use
        to update their slice in place without reloading. Reflects whatever the last
        sync/sample wrote; nothing is fetched from an upstream on this path.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The module id (as it appears under `modules` in the site view).
          schema:
            type: string
        - $ref: "#/components/parameters/Locale"
        - name: tz
          in: query
          required: false
          description: IANA time zone to bucket days in (the visitor's own zone). Invalid or absent falls back to the owner's configured zone.
          schema: { type: string, example: Europe/Berlin }
        - name: days
          in: query
          required: false
          description: Window the activity modules cover, in days. Omitted or any value outside the allowed set falls back to the module's CMS-configured default.
          schema: { type: integer, enum: [14, 30, 90, 180, 365] }
      responses:
        "200":
          description: The resolved module.
          content:
            application/json:
              schema:
                type: object
                description: A resolved module — `{ id, kind, data }`. `data` varies by `kind`.
                properties:
                  id: { type: string }
                  kind: { type: string }
                  data: { type: object }
        "404":
          description: No module with that id in the current view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/presence:
    get:
      tags: [Presence]
      summary: Live Discord presence (server-filtered)
      description: |
        The current Discord presence, fetched server-side from Lanyard and filtered to the
        owner's CMS allow-list before it leaves the server. The browser never receives the
        Discord id, the category list, or any category the owner disabled.

        Returns a plain **offline** view (`status: offline`, empty `cards`) when Discord isn't
        configured (`DISCORD_USER_ID` unset), the owner has hidden every live category, or
        Lanyard is unreachable. This is intentional: the widget polls regardless and renders
        whatever comes back, so enablement (a CMS display decision) is fully decoupled from
        whether the server is wired up.

        Responses are shared-cached briefly (keyed on the allow-list, so a CMS toggle is never
        masked), which bounds how often Lanyard is polled no matter how many visitors watch.
      security: []
      responses:
        "200":
          description: The filtered presence snapshot (possibly offline).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceView"

  /api/playtime/day:
    get:
      tags: [Activity]
      summary: One day's game breakdown
      description: |
        The per-game playtime for a single day — the drill-in behind a clicked column in the
        playtime ledger. Fetched on demand rather than shipped with the module (the strip spans
        ~365 days). Games only; games the owner hid in the CMS are dropped.
      security: []
      parameters:
        - $ref: "#/components/parameters/Day"
      responses:
        "200":
          description: The day's per-game minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaytimeDayResponse"
        "400":
          $ref: "#/components/responses/BadDay"

  /api/music/day:
    get:
      tags: [Activity]
      summary: One day's tracks
      description: |
        The tracks played on a single day — the drill-in behind a clicked column in the
        listening timeline (parallel to `/api/playtime/day`). Fetched on demand. Tracks come
        from Discord's Spotify presence; there is no per-track hide list.
      security: []
      parameters:
        - $ref: "#/components/parameters/Day"
      responses:
        "200":
          description: The day's tracks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicDayResponse"
        "400":
          $ref: "#/components/responses/BadDay"

  /api/presence/media:
    get:
      tags: [Media]
      summary: Presence image relay (with a labelled fallback tile)
      description: |
        Relays a presence image (Discord avatar/art, Steam icon, Spotify cover) through this
        origin so the visitor's IP never reaches the third-party CDN. `u` is fetched **only**
        when its host is on a fixed allow-list, over https, with redirects refused — so a crafted
        `u` can't be used for SSRF.

        When there is no usable upstream image, pass `game=<name>` to get a deterministic,
        labelled SVG tile instead, so the widget always has something tidy to show. With `game`,
        the cover resolves through the stored fallback chain first (RAWG cover, then the image
        resolved from the game's Discord activity or application icon) before the tile.
      security: []
      parameters:
        - name: u
          in: query
          required: false
          description: Upstream image URL. Fetched only if its host is allow-listed (Discord/Steam/Spotify CDNs).
          schema:
            type: string
            format: uri
        - name: game
          in: query
          required: false
          description: Game name — yields a generated labelled tile when `u` is missing or blocked.
          schema:
            type: string
      responses:
        "200":
          description: The relayed image, or a generated SVG fallback tile.
          content:
            image/*:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        "404":
          description: Neither a usable `u` nor a `game` fallback was available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{id}:
    get:
      tags: [Media]
      summary: A library asset (original)
      description: A stored library asset by id — image, gif, svg, or markdown source.
      security: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The asset bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/{variant}:
    get:
      tags: [Media]
      summary: A resized/encoded asset variant
      description: |
        A generated variant of an image asset, e.g. `w320.webp`. Variants are produced from the
        original and capped to its intrinsic width.
      security: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: variant
          in: path
          required: true
          description: Variant name, e.g. `w320.webp`, `w640.avif`.
          schema:
            type: string
      responses:
        "200":
          description: The variant bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assets/md/{slug}:
    get:
      tags: [Media]
      summary: A markdown asset's source
      description: |
        The raw source of a markdown asset (used by the CMS editor and for on-site rendering).
        Public because the editor needs the raw file; drafts are gated by a preview token.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The markdown asset with its source.
          content:
            application/json:
              schema:
                type: object
                description: An `Asset` plus its `markdown` source (contract `MarkdownAssetResponse` in `@lg/core`).
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────── Public: relays ─────────────────────────────
  /api/guestbook:
    post:
      tags: [Guestbook]
      summary: Submit a guestbook entry (pre-moderated)
      description: |
        Stores a new entry as **pending** — it is never shown until the owner approves it in the
        CMS queue. Only name + message + a server-assigned timestamp are stored (no IP, no
        identifier). A honeypot field and a coarse per-IP rate limit keep casual spam down; a
        honeypot hit is silently accepted so bots don't learn. No id is returned, because the
        entry isn't public yet.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestbookSubmission"
      responses:
        "200":
          description: Accepted into the moderation queue (or a silently-swallowed honeypot hit).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  pending: { const: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/reactions/wave:
    get:
      tags: [Reactions]
      summary: Read the global wave count
      security: []
      responses:
        "200":
          description: The current total.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
    post:
      tags: [Reactions]
      summary: Wave (increment the global counter)
      description: |
        Adds one to a single global counter and returns the new total. Stores no visitor data:
        no IP, no identifier, no timestamp. A coarse per-IP rate limit is kept in memory only,
        keyed by a salted hash of the address with a salt that is random per process, so it
        resets on restart and cannot be correlated afterwards. The count also rides along in the
        site view as `modules.hero.data.waves`.
      security: []
      responses:
        "200":
          description: The new total.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 1 }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/contact:
    post:
      tags: [Contact]
      summary: Send a contact message (relayed to email)
      description: |
        Relays a message to the owner's email and stores **nothing**. Requires SMTP to be
        configured, else `503`. A honeypot field and a per-IP rate limit apply; CR/LF is stripped
        from name/email to prevent header injection.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessage"
      responses:
        "200":
          description: Relayed (or a silently-swallowed honeypot hit).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Contact is not configured (no SMTP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pulse:
    post:
      tags: [Engagement]
      summary: Cookieless engagement beacon
      description: |
        Accepts a small batch of **anonymous, already-bucketed** engagement events
        (`navigator.sendBeacon`, usually `text/plain` to avoid a CORS preflight). Each event is
        validated against the shared vocabulary and the live nav, then folded into aggregate
        hourly counters. No cookie, no identifier, no raw rows, no client timestamps — the day is
        assigned server-side. Returns `204` with no body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseBatch"
          text/plain:
            schema:
              type: string
              description: A JSON `PulseBatch` sent as text/plain by `sendBeacon`.
      responses:
        "204":
          description: Accepted (valid events folded into counters). No body.
        "400":
          description: Unparseable body or missing `events` array.
        "429":
          description: Per-IP beacon rate limit exceeded.

  # ─────────────────────────────────── Auth ───────────────────────────────────
  /auth/github/login:
    get:
      tags: [Auth]
      summary: Begin GitHub OAuth
      description: |
        Redirects to GitHub with a signed, single-use `state` cookie for CSRF protection. The
        validated `returnTo` path is carried in the same signed cookie and used after login.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: |
            Same-origin path to return to after sign-in. It must start with a single `/`. Anything
            else (`//host`, `/\host`, absolute URLs), or any value containing a backslash or a
            control character, falls back to `/admin`.
          schema: { type: string, default: /admin }
      responses:
        "302":
          description: Redirect to GitHub's authorization page, with the signed `lg_oauth_state` cookie set (10 minutes).
        "503":
          description: OAuth is not configured (no client id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/dev/login:
    get:
      tags: [Auth]
      summary: One-click local development login
      description: |
        Mints the same signed session cookie the OAuth flow does, without a GitHub round-trip.
        The route is **not registered** when `NODE_ENV=production`, so it does not exist on a
        deployed server. Even when registered it serves loopback callers only (judged by the TCP
        peer address, not `X-Forwarded-For`).
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Same-origin path to redirect to, validated exactly as for `/auth/github/login`. Falls back to `/admin`.
          schema: { type: string, default: /admin }
      responses:
        "302":
          description: Redirect to the web origin plus `returnTo`, with an http-only `lg_session` cookie valid for 8 hours.
        "403":
          description: The caller is not on a loopback address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth callback
      description: |
        Verifies `state`, exchanges the code, and issues (only if the GitHub login matches the
        allowed login) a signed, http-only `lg_session` cookie the CMS uses. Then redirects to the
        web origin plus the `returnTo` path chosen at login (default `/admin`).
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to the app. The `lg_session` cookie (30 days) is set and the state cookie consumed.
        "400":
          description: The signed state cookie is missing, invalid or does not match `state`, or `code` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: GitHub did not return an access token for the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The authenticated GitHub login is not the single allowed CMS login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: OAuth is not configured (no client id or secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the CMS session
      description: Clears the `lg_session` cookie. Succeeds whether or not a session existed.
      security: []
      responses:
        "200":
          description: Session cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  # ────────────────────────────── CMS · Content ───────────────────────────────
  /api/cms/me:
    get:
      tags: [CMS · Content]
      summary: Who am I
      description: The authenticated login, or `null`. Used by the CMS to gate the UI.
      responses:
        "200":
          description: The current session's login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { type: [string, "null"] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cms/content:
    get:
      tags: [CMS · Content]
      summary: The whole editable world
      description: The full editable content model in one request (contract `CmsContentResponse` in `@lg/core`).
      responses:
        "200":
          description: The editable content.
          content:
            application/json:
              schema:
                type: object
                description: See `CmsContentResponse` in `@lg/core` — content, nav, modules, presence settings.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cms/modules:
    put:
      tags: [CMS · Content]
      summary: Update module headings, notes and settings
      description: |
        Partial merge by module id: only the modules in the body are touched, and within each
        only the fields sent. `heading` and `note` are localized objects (`en` required, only
        `en`/`de` keys), so a German-only body is rejected with 400. They merge per locale: a
        non-empty locale is set, and an empty string for a non-English locale removes that
        locale. An empty `en` keeps the stored English, and a value with every locale empty
        clears the field. An unknown module id is 400. `settings` is accepted for `featured`
        modules only (400 otherwise). The schema bounds the shape of `settings` (at most 50
        `repos`, each up to 100 characters); the sanitizer then trims and de-duplicates `repos`
        and caps them at 3, and silently clamps `count` to 1..3 rather than rejecting
        out-of-range values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modules]
              additionalProperties: false
              properties:
                modules:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                      id: { type: string, minLength: 1, maxLength: 64 }
                      heading: { $ref: "#/components/schemas/Localized" }
                      note: { $ref: "#/components/schemas/Localized" }
                      settings:
                        type: object
                        description: Featured module settings.
                        additionalProperties: false
                        properties:
                          mode: { type: string, enum: [auto, manual] }
                          repos:
                            type: array
                            maxItems: 50
                            items: { type: string, maxLength: 100 }
                          count: { type: number, description: "Clamped to 1..3 by the sanitizer, not rejected." }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/github-repos:
    get:
      tags: [CMS · Content]
      summary: Synced GitHub repos (Featured picker)
      responses:
        "200":
          description: Repos from the latest GitHub sync, newest push first. Empty before the first sync.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        language: { type: string }
                        pinned: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cms/meta:
    put:
      tags: [CMS · Content]
      summary: Update site identity (name, handle, location, role, avatar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteMetaBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/headline:
    put:
      tags: [CMS · Content]
      summary: Update the hero headline (before / highlight / after)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeadlineBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/lede:
    put:
      tags: [CMS · Content]
      summary: Update the lede (a localized string)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Localized" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/bio:
    put:
      tags: [CMS · Content]
      summary: Update the bio (an array of localized paragraphs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Localized" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/presence:
    put:
      tags: [CMS · Content]
      summary: Update presence display settings
      description: |
        The presence allow-list and related toggles: which categories are **shown** (this is what
        drives module enablement on the site), which are **sampled** into history, retention, and
        the hidden-games list. These are read per-request by `/api/presence`, so a change takes
        effect immediately. Omitted optional fields are filled from the defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [show]
              additionalProperties: false
              properties:
                show:
                  type: array
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/PresenceCategory" }
                sample:
                  type: array
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/PresenceCategory" }
                retentionDays:
                  description: Days of presence history to keep; `null` keeps it forever.
                  type: [integer, "null"]
                  enum: [null, 730, 365, 180, 90, 30]
                hidden:
                  type: array
                  maxItems: 200
                  description: Activity names to hide.
                  items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/music:
    put:
      tags: [CMS · Content]
      summary: Update the Listening module's display settings
      description: Partial body is fine; omitted fields are filled from the defaults. Counts are clamped so `initialCount` never exceeds `maxCount`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListDisplaySettings" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/playtime:
    put:
      tags: [CMS · Content]
      summary: Update the Played module's display settings
      description: Same shape and bounds as `/api/cms/music`, stored separately so the two modules' limits can differ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListDisplaySettings" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/wrapped:
    put:
      tags: [CMS · Content]
      summary: Update the Wrapped schedule
      description: |
        Stores intent only; the resolver decides visibility from these settings. Partial body is
        fine; omitted fields are filled from the defaults. Numbers are clamped and an unparseable
        date is dropped by the sanitizer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                everyMonths: { type: integer, minimum: 1, maximum: 24 }
                forWeeks: { type: integer, minimum: 1, maximum: 12 }
                fromDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: "Schedule anchor, `YYYY-MM-DD`." }
                topCount: { type: integer, minimum: 3, maximum: 20 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/referrer-rules:
    put:
      tags: [CMS · Analytics]
      summary: Replace the custom referrer rules
      description: Rules map a referrer match to a source label. They are applied when the analytics dashboard is read, so saving a rule relabels traffic that arrived before it existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              additionalProperties: false
              properties:
                rules:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [match, label]
                    additionalProperties: false
                    properties:
                      match: { type: string, minLength: 1, maxLength: 200 }
                      label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/projects/{id}:
    put:
      tags: [CMS · Content]
      summary: Upsert a project (fallback for when no GitHub data is synced)
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Content]
      summary: Delete a project
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/hobbies/{id}:
    put:
      tags: [CMS · Content]
      summary: Upsert a hobby
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Content]
      summary: Delete a hobby
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/links/{id}:
    put:
      tags: [CMS · Content]
      summary: Upsert a contact/social link
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [CMS · Content]
      summary: Delete a link
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cms/now/{id}:
    put:
      tags: [CMS · Content]
      summary: Upsert a "now" item
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses:
